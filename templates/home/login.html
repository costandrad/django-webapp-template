{% extends 'base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}




<!-- Contact Section -->
<section id="contact" class="contact section light-background">

    <!-- Section Title -->
    <div class="container section-title" data-aos="fade-up">
        <h2>Login</h2>
        <div><span>Acessar o Sistema</span></div>
    </div><!-- End Section Title -->

    <div class="container mx-auto" data-aos="fade-up" data-aos-delay="100">

        <div class="row gy-4">


            <div class="col-lg-6 mx-auto">
                <form method="post" class="php-email-form" data-aos="fade-up" data-aos-delay="500">
                    {% csrf_token %}

                    {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuário ou senha inválidos.
                    </div>
                    {% endif %}
                    <div class="row gy-4">

                        <div class="col-md-12">
                            <label for="id_username" class="form-label">Usuário</label>
                            <input type="text" name="username" id="id_username" class="form-control"
                                placeholder="Usuário" required autofocus>
                        </div>



                        <div class="col-md-12">
                            <label for="id_password" class="form-label">Senha</label>
                            <input type="password" name="password" id="id_password" class="form-control"
                                placeholder="Senha" required>
                        </div>

/

                        <div class="col-md-12 text-center">
                            <div class="loading">Loading</div>
                            <div class="error-message"></div>
                            <div class="sent-message">Your message has been sent. Thank you!</div>

                            <button type="submit">Entrar</button>
                        </div>

                    </div>
                </form>
            </div><!-- End Contact Form -->

        </div>

    </div>

</section><!-- /Contact Section -->

{% endblock %}
